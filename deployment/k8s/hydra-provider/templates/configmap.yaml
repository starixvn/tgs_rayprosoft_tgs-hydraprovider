apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "hydra-provider.fullname" . }}
data:
  appsettings.json: |
    {
      "Hydra": {
        "AdminUrl": "http://auth-hydra-admin.auth-test:4445"
      }
    }

  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]
